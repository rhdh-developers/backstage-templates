# Optional cluster install – use when argocd:create-resources is NOT available on RHDH.
# Targets the OpenShift GitOps Argo CD instance (CR openshift-gitops, namespace openshift-gitops).
# Creates an Application per <org>/*-k8 repo on branch main.
#
#   oc apply -f cluster/applicationset-python-fastapi.yaml -n openshift-gitops
#
# Then remove the create-argocd-app step from templates/python-fastapi/template.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rhdh-python-fastapi
  namespace: openshift-gitops
spec:
  generators:
    - scmProvider:
        cloneProtocol: https
        github:
          organization: rhdh-developers
        filters:
          - repositoryMatch: .*-k8$
            branches:
              - main
  template:
    metadata:
      name: '{{ trimSuffix "-k8" .repository }}'
      labels:
        app.kubernetes.io/name: '{{ trimSuffix "-k8" .repository }}'
        backstage.io/kubernetes-id: '{{ trimSuffix "-k8" .repository }}'
    spec:
      project: default
      source:
        repoURL: '{{ .url }}'
        targetRevision: main
        path: k8/gitops
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ trimSuffix "-k8" .repository }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
