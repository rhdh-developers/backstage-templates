apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ${{ values.appName }}
    app.kubernetes.io/component: ${{ values.appName }}
    app.kubernetes.io/instance: ${{ values.appName }}
    app.kubernetes.io/name: ${{ values.appName }}
    app.kubernetes.io/part-of: ${{ values.appName }}
    app.openshift.io/runtime: nodejs
    app.openshift.io/runtime-version: 22-minimal-ubi10
  name: ${{ values.appName }}
  namespace: ${{ values.namespace }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ${{ values.appName }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${{ values.appName }}
        deployment: ${{ values.appName }}
    spec:
      containers:
      - name: ${{ values.appName }}
        image: image-registry.openshift-image-registry.svc:5000/${{ values.namespace }}/${{ values.appName }}:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: LLM_API_URL
          valueFrom:
            configMapKeyRef:
              name: ${{ values.appName }}-chat-config
              key: LLM_API_URL
        - name: LLM_AUTH_TOKEN
          valueFrom:
            configMapKeyRef:
              name: ${{ values.appName }}-chat-config
              key: LLM_AUTH_TOKEN
        - name: LLM_CONTENT_TYPE
          valueFrom:
            configMapKeyRef:
              name: ${{ values.appName }}-chat-config
              key: LLM_CONTENT_TYPE
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: ${{ values.appName }}-chat-config
              key: LLM_MODEL
        - name: LLM_SYSTEM_PROMPT
          valueFrom:
            configMapKeyRef:
              name: ${{ values.appName }}-chat-config
              key: LLM_SYSTEM_PROMPT
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
