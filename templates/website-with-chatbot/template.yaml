apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: website-with-chatbot
  title: Node.js Website with LLM Chatbot
  description: >
    Creates a Node.js web application with an integrated LLM-powered chatbot.
    Scaffolds two GitLab repos (source code and k8s manifests), an ArgoCD GitOps
    deployment, a Tekton CI pipeline, and an OpenShift Route for ingress — no
    gateway required.
  tags:
    - nodejs
    - chatbot
    - llm
    - openshift
    - gitops
    - tekton
    - argocd
    - gitlab

spec:
  owner: group:default/rhdh
  type: service

  parameters:
    - title: Application Details
      required:
        - appName
        - gitlabUrl
        - gitlabGroup
        - owner
        - namespace
      properties:
        appName:
          title: Application Name
          type: string
          default: website-with-chatbot
          description: >
            Unique name for this app. Used for GitLab repos (<name>-code, <name>-k8),
            ArgoCD Application, Kubernetes object names, and the OpenShift Route host.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        gitlabUrl:
          title: GitLab Instance URL
          type: string
          default: https://gitlab-gitlab.apps.cluster-9vqpx.dynamic2.redhatworkshops.io
          description: >
            Base URL of your GitLab instance. Use the default for the shared cluster GitLab,
            or enter your own instance URL.
          ui:help: 'Example: https://gitlab-gitlab.apps.cluster-9vqpx.dynamic2.redhatworkshops.io'
        gitlabGroup:
          title: GitLab Group
          type: string
          default: parasol
          description: GitLab group (or subgroup path) where both repos will be created.
          ui:help: 'Example: parasol or parasol/my-subgroup'
        owner:
          title: Owner
          type: string
          default: group:default/rhdh
          description: Backstage owner of this component (user or group).
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        namespace:
          title: OpenShift Namespace
          type: string
          default: lux-living
          description: >
            OpenShift project where this app's workloads are deployed. ArgoCD will
            create the namespace automatically via CreateNamespace=true.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
        clusterAppDomain:
          title: Cluster App Domain
          type: string
          default: apps.cluster-9vqpx.dynamic2.redhatworkshops.io
          description: >
            Base domain for cluster apps. Used to generate the Dev Spaces link.
          ui:help: 'Example: apps.cluster-9vqpx.dynamic2.redhatworkshops.io'
    - title: LLM Configuration
      required:
        - llmEndpoint
        - llmToken
        - llmModel
      properties:
        llmEndpoint:
          title: LLM API Endpoint
          type: string
          default: https://maas-rhdp.apps.maas.redhatworkshops.io/v1/chat/completions
          description: >
            Full URL of the LLM inference endpoint (OpenAI-compatible chat completions API).
          ui:help: 'Example: https://maas-rhdp.apps.maas.redhatworkshops.io/v1/chat/completions'
        llmToken:
          title: LLM Auth Token
          type: string
          description: Bearer token / API key for authenticating with the LLM endpoint.
          ui:help: 'Example: sk-Oow_b5M_ctA8F5RVjQ65Tw'
        llmModel:
          title: LLM Model Name
          type: string
          default: llama-scout-17b
          description: Model identifier to pass in the LLM request payload.
          ui:help: 'Example: llama-scout-17b'
        llmSystemPrompt:
          title: LLM System Prompt
          type: string
          default: "You are a customer service assistant exclusively for Lux & Living. You may only answer questions related to Lux & Living products, orders, shipping, returns, and other customer service topics specific to this company. If a user asks about anything unrelated to Lux & Living — such as general knowledge, other companies, or off-topic subjects — politely decline and redirect them by saying you can only assist with Lux & Living customer service inquiries. Do not answer questions outside this scope under any circumstances."
          description: System prompt that controls the chatbot's persona and scope.
          ui:widget: textarea
          ui:options:
            rows: 6

  steps:
    # -------------------------------------------------------------------------
    # 1. Render source-code skeleton
    # -------------------------------------------------------------------------
    - id: fetch-code-skeleton
      name: Render Source Code Skeleton
      action: fetch:template
      input:
        url: ./skeleton/code
        targetPath: ./code
        values:
          appName: ${{ parameters.appName }}
          gitlabUrl: ${{ parameters.gitlabUrl }}
          gitlabGroup: ${{ parameters.gitlabGroup }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}
          clusterAppDomain: ${{ parameters.clusterAppDomain }}

    # -------------------------------------------------------------------------
    # 2. Render k8s/GitOps skeleton
    # -------------------------------------------------------------------------
    - id: fetch-k8-skeleton
      name: Render K8s/GitOps Skeleton
      action: fetch:template
      input:
        url: ./skeleton-k8
        targetPath: ./k8
        values:
          appName: ${{ parameters.appName }}
          gitlabUrl: ${{ parameters.gitlabUrl }}
          gitlabGroup: ${{ parameters.gitlabGroup }}
          namespace: ${{ parameters.namespace }}
          llmEndpoint: ${{ parameters.llmEndpoint }}
          llmToken: ${{ parameters.llmToken }}
          llmModel: ${{ parameters.llmModel }}
          llmSystemPrompt: ${{ parameters.llmSystemPrompt }}

    # -------------------------------------------------------------------------
    # 3. Publish source-code repo to GitLab: <group>/<appName>-code
    # -------------------------------------------------------------------------
    - id: publish-code
      name: Create Source Code Repository
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.gitlabUrl | replace("https://", "") }}?repo=${{ parameters.appName }}-code&owner=${{ parameters.gitlabGroup }}
        defaultBranch: main
        sourcePath: ./code
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 4. Publish k8s manifests repo to GitLab: <group>/<appName>-k8
    # -------------------------------------------------------------------------
    - id: publish-k8
      name: Create K8s Manifests Repository
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.gitlabUrl | replace("https://", "") }}?repo=${{ parameters.appName }}-k8&owner=${{ parameters.gitlabGroup }}
        defaultBranch: main
        sourcePath: ./k8
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 5. Create bootstrap ArgoCD Application (app-of-apps pattern)
    #    Points to k8/argocd/ which contains the actual Application manifest
    #    using project: default. The bootstrap project only needs rhdh-gitops.
    # -------------------------------------------------------------------------
    - id: create-argocd-app
      name: Create ArgoCD Bootstrap Application
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}-bootstrap
        argoInstance: main
        namespace: rhdh-gitops
        repoUrl: ${{ steps['publish-k8'].output.remoteUrl }}.git
        path: k8/argocd
        labelValue: ${{ parameters.appName }}

    # -------------------------------------------------------------------------
    # 6. Register catalog component
    # -------------------------------------------------------------------------
    - id: register-catalog
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-code'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps['publish-code'].output.remoteUrl }}
        icon: gitlab
      - title: K8s Manifests Repository
        url: ${{ steps['publish-k8'].output.remoteUrl }}
        icon: gitlab
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: What happens next
        content: |
          **Application:** `${{ parameters.appName }}`
          **Namespace:** `${{ parameters.namespace }}`
          **GitLab:** `${{ parameters.gitlabUrl }}/${{ parameters.gitlabGroup }}`
          **LLM Model:** `${{ parameters.llmModel }}`
          **LLM Endpoint:** `${{ parameters.llmEndpoint }}`

          **Your app's Route** will be available after the build completes:
          ```
          oc get route ${{ parameters.appName }} -n ${{ parameters.namespace }}
          ```

          Open the catalog component to see the Kubernetes, ArgoCD, and Tekton plugin tabs.
