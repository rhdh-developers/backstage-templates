apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.appName }}
  description: Python FastAPI REST API service – ${{ values.appName }}
  annotations:
    # Argo CD – app-name is the Application CR; instance-name matches the template form
    argocd/app-name: ${{ values.appName }}
    argocd/instance-name: ${{ values.argoInstance }}
    # Kubernetes integration (shows Pods/Deployments tab)
    backstage.io/kubernetes-id: ${{ values.appName }}
    backstage.io/kubernetes-namespace: ${{ values.namespace }}
    # Tekton integration (shows PipelineRuns tab)
    janus-idp.io/tekton-enabled: "true"
    janus-idp.io/tekton-namespace: ${{ values.namespace }}
    # Dev Spaces – devfile in the code repo
    che.eclipse.org/devfile-url: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-code/blob/main/.devfile.yaml
    # Source code location for Backstage
    backstage.io/source-location: url:https://github.com/${{ values.githubOrg }}/${{ values.appName }}-code
    # GitHub repos for SCM links
    github.com/project-slug: ${{ values.githubOrg }}/${{ values.appName }}-code
  links:
    - url: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-code
      title: Source Code (GitHub)
      icon: github
    - url: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-k8
      title: Deployment Manifests (GitHub)
      icon: github
    - url: https://${{ values.appName }}.${{ values.gateway }}/api/v1/
      title: API Endpoint
      icon: api
    - url: https://${{ values.appName }}.${{ values.gateway }}/docs
      title: API Docs
      icon: api
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  providesApis:
    - ${{ values.appName }}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.appName }}-api
  description: OpenAPI spec for the ${{ values.appName }} FastAPI service
spec:
  type: openapi
  lifecycle: experimental
  owner: ${{ values.owner }}
  definition: |
    openapi: 3.1.0
    info:
      title: ${{ values.appName }}
      description: FastAPI REST API service scaffolded by RHDH
      version: 0.1.0
    paths:
      /api/v1/hello:
        get:
          summary: Hello
          operationId: hello_api_v1_hello_get
          responses:
            "200":
              description: Successful Response
              content:
                application/json:
                  schema: {}
      /health:
        get:
          summary: Health
          operationId: health_health_get
          responses:
            "200":
              description: Successful Response
              content:
                application/json:
                  schema: {}
