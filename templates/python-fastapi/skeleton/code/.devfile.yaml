schemaVersion: 2.2.2
metadata:
  name: ${{ values.appName }}
  displayName: ${{ values.appName }} – Python FastAPI
  description: OpenShift Dev Spaces environment for ${{ values.appName }}
  language: Python
  projectType: FastAPI

projects:
  - name: ${{ values.appName }}-code
    git:
      remotes:
        origin: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-code.git
      checkoutFrom:
        revision: main

components:
  - name: python
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.28
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
      volumeMounts:
        - name: venv
          path: /home/user/.venv
  - name: venv
    volume:
      size: 1G

commands:
  - id: install-deps
    exec:
      component: python
      commandLine: python -m venv /home/user/.venv && . /home/user/.venv/bin/activate && pip install -r requirements.txt
      workingDir: ${PROJECT_SOURCE}
      label: Install Dependencies
      group:
        kind: build
        isDefault: true

  - id: run-dev
    exec:
      component: python
      commandLine: . /home/user/.venv/bin/activate && uvicorn main:app --reload --host 0.0.0.0 --port 8000
      workingDir: ${PROJECT_SOURCE}
      label: Run Dev Server
      group:
        kind: run
        isDefault: true

  - id: run-tests
    exec:
      component: python
      commandLine: . /home/user/.venv/bin/activate && python -m pytest -v
      workingDir: ${PROJECT_SOURCE}
      label: Run Tests
      group:
        kind: test
        isDefault: true
