# ArgoCD Application – applied by the RHDH template bootstrap (oc) into
# openshift-gitops. ArgoCD then syncs k8/gitops (Tekton, routes, deployment).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.appName }}
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    backstage.io/kubernetes-id: ${{ values.appName }}
spec:
  project: default
  source:
    repoURL: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-k8.git
    targetRevision: main
    path: k8/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
