# Argo CD Application for OpenShift GitOps.
#
# - Argo CD operator CR: argoproj.io/v1beta1 ArgoCD named "openshift-gitops"
#   in namespace "openshift-gitops" (NOT the app workload namespace).
# - This Application CR is created in openshift-gitops by argocd:create-resources.
# - Destination namespace (${{ values.namespace }}) receives synced k8/gitops manifests.
#
# OpenShift GitOps excludes tekton.dev/TaskRun and PipelineRun from reconciliation;
# the Pipeline, triggers, and PostSync hook PipelineRun still deploy from gitops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.appName }}
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    backstage.io/kubernetes-id: ${{ values.appName }}
spec:
  project: default
  source:
    repoURL: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-k8.git
    targetRevision: main
    path: k8/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
