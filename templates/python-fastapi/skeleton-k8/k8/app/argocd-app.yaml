# Argo CD Application for OpenShift GitOps.
#
# - Argo CD operator CR: argoproj.io/v1beta1 ArgoCD named "openshift-gitops"
#   in namespace "openshift-gitops" (NOT the app workload namespace).
# - Application CR lives in openshift-gitops; workloads sync to ${{ values.namespace }}.
# - Namespace is created by kubernetes:create-namespace before this Application is registered.
# - ignoreDifferences below keeps Argo CD from reconciling the Namespace (even if
#   namespace.yaml is present in git for documentation).
#
# OpenShift GitOps excludes tekton.dev/PipelineRun and TaskRun from reconciliation;
# the Pipeline, triggers, and deployment still deploy from gitops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.appName }}
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    backstage.io/kubernetes-id: ${{ values.appName }}
spec:
  project: default
  source:
    repoURL: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-k8.git
    targetRevision: main
    path: k8/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}
  ignoreDifferences:
    - group: ""
      kind: Namespace
      name: ${{ values.namespace }}
      jqPathExpressions:
        - .
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
      - ServerSideApply=true
