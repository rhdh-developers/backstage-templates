apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: ${{ values.appName }}-listener
  namespace: ${{ values.namespace }}
spec:
  serviceAccountName: pipeline
  triggers:
  - name: github-push
    interceptors:
    - ref:
        name: github
      params:
      - name: secretRef
        value:
          secretName: github-webhook-secret
          secretKey: secret
      - name: eventTypes
        value:
        - push
    bindings:
    - ref: ${{ values.appName }}-binding
    template:
      ref: ${{ values.appName }}-template
---
# Route that exposes the EventListener so GitHub can POST webhook events to it.
# After applying, get the URL with:
#   oc get route el-${{ values.appName }}-listener -n ${{ values.namespace }} -o jsonpath='{.spec.host}'
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-${{ values.appName }}-listener
  namespace: ${{ values.namespace }}
spec:
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: el-${{ values.appName }}-listener
    weight: 100
