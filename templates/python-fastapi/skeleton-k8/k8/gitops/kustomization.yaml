apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Synced by the Argo CD Application in namespace openshift-gitops (path: k8/gitops).
# Namespace is created on first Argo CD sync; ignoreDifferences on the Application
# (k8/app/argocd-app.yaml) prevents ongoing Namespace reconciliation.
# OpenShift GitOps does not reconcile tekton.dev/PipelineRun or TaskRun.

resources:
  - namespace.yaml
  - pipeline.yaml
  - triggerbinding.yaml
  - triggertemplate.yaml
  - eventlistener.yaml
  - eventlistener-route.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  # Initial PipelineRun: use k8/app/pipelinerun.yaml (generateName is invalid in Kustomize)
