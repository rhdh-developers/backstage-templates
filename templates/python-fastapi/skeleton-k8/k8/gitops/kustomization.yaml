apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Synced by the Argo CD Application in namespace openshift-gitops (path: k8/gitops).
# The app namespace is created by kubernetes:create-namespace in the template; it is
# not listed here so Argo CD does not reconcile Namespace from git.
# OpenShift GitOps does not reconcile tekton.dev/PipelineRun or TaskRun; Pipeline
# and triggers are synced.

resources:
  - pipeline.yaml
  - triggerbinding.yaml
  - triggertemplate.yaml
  - eventlistener.yaml
  - eventlistener-route.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  # Initial PipelineRun: use k8/app/pipelinerun.yaml (generateName is invalid in Kustomize)
