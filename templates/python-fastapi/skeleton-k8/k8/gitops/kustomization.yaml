apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Synced by the Argo CD Application in namespace openshift-gitops (path: k8/gitops).
# Workloads land in the app namespace (see namespace.yaml). OpenShift GitOps does
# not reconcile tekton.dev/PipelineRun or TaskRun; Pipeline and triggers are synced.

resources:
  - namespace.yaml
  - pipeline.yaml
  - triggerbinding.yaml
  - triggertemplate.yaml
  - eventlistener.yaml
  - eventlistener-route.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  # Initial PipelineRun: use k8/app/pipelinerun.yaml (generateName is invalid in Kustomize)
