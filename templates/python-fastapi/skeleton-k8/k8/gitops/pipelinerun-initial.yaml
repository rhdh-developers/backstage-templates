# Initial build – executed once by ArgoCD after the gitops Application syncs.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ${{ values.appName }}-initial-
  namespace: ${{ values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
  labels:
    app.kubernetes.io/instance: ${{ values.appName }}
    backstage.io/kubernetes-id: ${{ values.appName }}
    tekton.dev/pipeline: ${{ values.appName }}
spec:
  pipelineRef:
    name: ${{ values.appName }}
  params:
  - name: APP_NAME
    value: ${{ values.appName }}
  - name: GIT_REPO
    value: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-code.git
  - name: GIT_K8_REPO
    value: https://github.com/${{ values.githubOrg }}/${{ values.appName }}-k8.git
  - name: GIT_REVISION
    value: main
  - name: IMAGE_NAME
    value: image-registry.openshift-image-registry.svc:5000/${{ values.namespace }}/${{ values.appName }}
  - name: PATH_CONTEXT
    value: .
  taskRunTemplate:
    serviceAccountName: pipeline
  timeouts:
    pipeline: 1h0m0s
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  - name: k8-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
