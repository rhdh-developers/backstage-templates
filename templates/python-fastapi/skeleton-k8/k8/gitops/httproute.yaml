apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app: ${{ values.appName }}
  namespace: ${{ values.namespace }}
  name: ${{ values.appName }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hostnames:
    - ${{ values.appName }}.${{ values.gateway }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ${{ 'prod-gateway' if values.gateway == 'demo.leonlevy.lol' else 'example-gateway' }}
      namespace: ingress-gateway
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: ${{ values.appName }}
          port: 8000
          weight: 1
      matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: PathPrefix
            value: /api/v1/
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: Exact
            value: /openapi.json
