apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app: ${{ values.appName }}
  namespace: ${{ values.namespace }}
  name: ${{ values.appName }}
spec:
  hostnames:
    - my-rest-api.demo.leonlevy.lol
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: prod-gateway
      namespace: ingress-gateway
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: ${{ values.appName }}
          port: 8000
          weight: 1
      matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: PathPrefix
            value: /api/v1/
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: Exact
            value: /openapi.json
