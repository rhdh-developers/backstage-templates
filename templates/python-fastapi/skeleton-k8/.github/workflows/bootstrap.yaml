name: Bootstrap OpenShift Resources

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Application name (Kubernetes resource and repo base name)
        required: true
        type: string
      namespace:
        description: OpenShift namespace for deployment and Tekton
        required: true
        type: string
      github_org:
        description: GitHub organization
        required: true
        type: string

jobs:
  bootstrap:
    name: Create namespace, ArgoCD app, secrets, webhook, and initial pipeline run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true

      # Create the namespace and label it so the OpenShift GitOps operator
      # grants the ArgoCD application controller admin rights in it.
      - name: Create and label namespace
        run: |
          oc new-project ${{ inputs.namespace }} || \
            echo "Namespace ${{ inputs.namespace }} already exists"
          oc label namespace ${{ inputs.namespace }} \
            argocd.argoproj.io/managed-by=openshift-gitops \
            --overwrite

      # Create the ArgoCD Application directly via oc apply in the
      # openshift-gitops namespace using project: default.
      - name: Create ArgoCD Application
        run: |
          oc apply -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${{ inputs.app_name }}
            namespace: openshift-gitops
            labels:
              app.kubernetes.io/name: ${{ inputs.app_name }}
              backstage.io/kubernetes-id: ${{ inputs.app_name }}
          spec:
            project: default
            source:
              repoURL: https://github.com/${{ inputs.github_org }}/${{ inputs.app_name }}-k8.git
              targetRevision: main
              path: k8/gitops
            destination:
              server: https://kubernetes.default.svc
              namespace: ${{ inputs.namespace }}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
          EOF

      # Store a GitHub token in the namespace so the Tekton pipeline can push
      # updated image digests back to the k8 repo. Prefer GITHUB_PAT for cross-repo access.
      - name: Create github-token secret
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          TOKEN="${GITHUB_PAT:-${{ secrets.GITHUB_TOKEN }}}"
          oc create secret generic github-token \
            --from-literal=token="$TOKEN" \
            -n ${{ inputs.namespace }} \
            --dry-run=client -o yaml | oc apply -f -

      # Wait for ArgoCD to sync the Pipeline resource (up to 5 minutes).
      - name: Wait for ArgoCD to sync Pipeline
        run: |
          echo "Waiting for ArgoCD to sync Pipeline '${{ inputs.app_name }}'..."
          for i in $(seq 1 30); do
            if oc get pipeline ${{ inputs.app_name }} \
                -n ${{ inputs.namespace }} &>/dev/null; then
              echo "Pipeline found after $((i * 10))s"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "WARNING: Pipeline not found after 5 minutes. ArgoCD may still be syncing."
          echo "Run the first pipeline manually once ArgoCD sync completes."
          exit 0

      # Wait for the EventListener Route (created by ArgoCD from gitops manifests).
      - name: Wait for EventListener route
        run: |
          echo "Waiting for EventListener route el-${{ inputs.app_name }}-listener..."
          for i in $(seq 1 30); do
            if oc get route "el-${{ inputs.app_name }}-listener" \
                -n ${{ inputs.namespace }} &>/dev/null; then
              echo "Route found after $((i * 10))s"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "WARNING: EventListener route not found — skipping webhook setup"
          exit 0

      # Register GitHub push webhook on the code repo (Tekton CI on push).
      - name: Configure GitHub push webhook
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          if ! oc get route "el-${{ inputs.app_name }}-listener" \
              -n ${{ inputs.namespace }} &>/dev/null; then
            echo "EventListener route missing — skipping webhook"
            exit 0
          fi
          TOKEN="${GITHUB_PAT:-${{ secrets.GITHUB_TOKEN }}}"
          WEBHOOK_SECRET=$(openssl rand -hex 20)
          oc create secret generic github-webhook-secret \
            --from-literal=secret="$WEBHOOK_SECRET" \
            -n ${{ inputs.namespace }} \
            --dry-run=client -o yaml | oc apply -f -
          LISTENER_URL=$(oc get route "el-${{ inputs.app_name }}-listener" \
            -n ${{ inputs.namespace }} -o jsonpath='https://{.spec.host}')
          REPO="${{ inputs.github_org }}/${{ inputs.app_name }}-code"
          PAYLOAD=$(jq -n \
            --arg url "$LISTENER_URL" \
            --arg secret "$WEBHOOK_SECRET" \
            '{name: "web", active: true, events: ["push"], config: {url: $url, content_type: "json", insecure_ssl: "0", secret: $secret}}')
          HTTP_CODE=$(curl -sS -o /tmp/gh-hook-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/hooks" \
            -d "$PAYLOAD")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "GitHub webhook created for ${REPO} → ${LISTENER_URL}"
          else
            echo "WARNING: GitHub webhook creation returned HTTP ${HTTP_CODE}"
            cat /tmp/gh-hook-response.json
          fi

      # Start the initial build so the app is deployed on first run.
      - name: Start initial PipelineRun
        run: |
          if ! oc get pipeline ${{ inputs.app_name }} \
              -n ${{ inputs.namespace }} &>/dev/null; then
            echo "Pipeline not ready — skipping initial PipelineRun"
            exit 0
          fi
          oc create -f - <<EOF
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            generateName: ${{ inputs.app_name }}-initial-
            namespace: ${{ inputs.namespace }}
            labels:
              app.kubernetes.io/instance: ${{ inputs.app_name }}
              backstage.io/kubernetes-id: ${{ inputs.app_name }}
              tekton.dev/pipeline: ${{ inputs.app_name }}
          spec:
            pipelineRef:
              name: ${{ inputs.app_name }}
            params:
            - name: APP_NAME
              value: ${{ inputs.app_name }}
            - name: GIT_REPO
              value: https://github.com/${{ inputs.github_org }}/${{ inputs.app_name }}-code.git
            - name: GIT_K8_REPO
              value: https://github.com/${{ inputs.github_org }}/${{ inputs.app_name }}-k8.git
            - name: GIT_REVISION
              value: main
            - name: IMAGE_NAME
              value: image-registry.openshift-image-registry.svc:5000/${{ inputs.namespace }}/${{ inputs.app_name }}
            - name: PATH_CONTEXT
              value: .
            taskRunTemplate:
              serviceAccountName: pipeline
            timeouts:
              pipeline: 1h0m0s
            workspaces:
            - name: workspace
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            - name: k8-workspace
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
          EOF
          echo "Initial PipelineRun created."
