apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-fastapi
  title: Python FastAPI Application
  description: >
    Creates a Python FastAPI REST API service with two GitHub repos (source code
    and deployment manifests), a Tekton CI pipeline, and an ArgoCD-managed
    OpenShift deployment. Registers a Backstage catalog component with links to
    source and manifests.
  tags:
    - python
    - fastapi
    - openshift
    - gitops
    - tekton
    - argocd
spec:
  owner: user:default/bugbiteme
  type: service

  parameters:
    - title: Application Details
      required:
        - appName
        - githubOrg
        - owner
      properties:
        appName:
          title: Application Name
          type: string
          default: my-rest-api
          description: >
            Lowercase name for your application. Used as the base name for both
            GitHub repos (<name>-code and <name>-k8), the OpenShift namespace,
            and all Kubernetes resources.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        githubOrg:
          title: GitHub Organization
          type: string
          default: rhdh-developers
          description: GitHub organization where both repos will be created.
        owner:
          title: Owner
          type: string
          description: Backstage owner of this component (user or group).
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

  steps:
    # -------------------------------------------------------------------------
    # 1. Render source-code skeleton into ./code workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-code-skeleton
      name: Render Source Code Skeleton
      action: fetch:template
      input:
        url: ./skeleton/code
        targetPath: ./code
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}

    # -------------------------------------------------------------------------
    # 2. Render k8s/gitops skeleton into ./k8 workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-k8-skeleton
      name: Render K8s/GitOps Skeleton
      action: fetch:template
      input:
        url: ./skeleton-k8
        targetPath: ./k8
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}

    # -------------------------------------------------------------------------
    # 3. Publish source-code repo: <org>/<appName>-code
    # -------------------------------------------------------------------------
    - id: publish-code
      name: Create Source Code Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-code&owner=${{ parameters.githubOrg }}
        description: Source code for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./code
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 4. Publish k8s manifests repo: <org>/<appName>-k8
    # -------------------------------------------------------------------------
    - id: publish-k8
      name: Create K8s Manifests Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-k8&owner=${{ parameters.githubOrg }}
        description: Kubernetes/GitOps manifests for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./k8
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 5. Dispatch the bootstrap GitHub Actions workflow in the k8 repo.
    #    The workflow: creates the OpenShift namespace (with the ArgoCD
    #    managed-by label), creates the github-token secret, waits for ArgoCD
    #    to sync the Pipeline, then starts the initial PipelineRun.
    #    Requires OPENSHIFT_SERVER and OPENSHIFT_TOKEN GitHub org secrets.
    # -------------------------------------------------------------------------
    - id: bootstrap
      name: Bootstrap OpenShift Resources
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-k8&owner=${{ parameters.githubOrg }}
        workflowId: bootstrap.yaml
        branchOrTagName: main
        workflowInputs:
          app_name: ${{ parameters.appName }}
          github_org: ${{ parameters.githubOrg }}

    # -------------------------------------------------------------------------
    # 7. Register the catalog component from the code repo's catalog-info.yaml
    # -------------------------------------------------------------------------
    - id: register-catalog
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-code'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps['publish-code'].output.remoteUrl }}
        icon: github
      - title: K8s Manifests Repository
        url: ${{ steps['publish-k8'].output.remoteUrl }}
        icon: github
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
      - title: Configure GitHub Webhook
        url: https://github.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-code/settings/hooks/new
        icon: github
    text:
      - title: What happens next
        content: |
          The **bootstrap** GitHub Actions workflow is running in the k8 repo.
          It will automatically:
          1. Create the `${{ parameters.appName }}` OpenShift namespace with the ArgoCD label
          2. Create the `github-token` secret so the pipeline can push image digests
          3. Wait for ArgoCD to sync the Tekton Pipeline
          4. Start the initial PipelineRun

          Monitor progress at:
          `https://github.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-k8/actions`

          **One remaining manual step — GitHub webhook** (triggers builds on every push):
          Once the bootstrap workflow completes, get the EventListener URL:
          ```
          oc get route el-${{ parameters.appName }}-listener -n ${{ parameters.appName }} \
            -o jsonpath='https://{.spec.host}'
          ```
          Create the webhook HMAC secret in OpenShift:
          ```
          oc create secret generic github-webhook-secret \
            --from-literal=secret=<random-string> \
            -n ${{ parameters.appName }}
          ```
          Add the webhook in GitHub (Settings → Webhooks on the code repo)
          pointing to that URL with the same random string as the secret.
