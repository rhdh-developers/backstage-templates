apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-fastapi
  title: Python FastAPI Application
  description: >
    Creates a Python FastAPI REST API service with two GitHub repos (source code
    and deployment manifests), OpenShift namespace, Tekton CI with GitHub push
    webhook, ArgoCD GitOps deployment, Dev Spaces devfile, and a Backstage catalog
    component with Kubernetes, ArgoCD, and Tekton plugin annotations.
  tags:
    - python
    - fastapi
    - openshift
    - gitops
    - tekton
    - argocd
spec:
  owner: group:default/rhdh-developers
  type: service

  parameters:
    - title: Application Details
      required:
        - appName
        - githubOrg
        - owner
        - namespace
        - argoInstance
      properties:
        appName:
          title: Application Name
          type: string
          default: my-rest-api
          description: >
            Lowercase name for your application. Used as the base name for both
            GitHub repos (<name>-code and <name>-k8) and Kubernetes resource names.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        githubOrg:
          title: GitHub Organization
          type: string
          default: rhdh-developers
          description: GitHub organization where both repos will be created.
        owner:
          title: Owner
          type: string
          default: group:default/rhdh-developers
          description: Backstage owner of this component (user or group).
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        namespace:
          title: OpenShift Namespace
          type: string
          default: my-rest-api
          description: >
            OpenShift namespace for the deployment, Tekton pipeline, and ArgoCD
            sync target. Usually matches the application name.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
        argoInstance:
          title: RHDH Argo CD instance name
          type: string
          default: default
          description: >
            Must match argocd.appLocatorMethods.instances[].name on Developer Hub
            (argocd:create-resources). Not the OpenShift GitOps CR name.
          ui:help: Case-sensitive. This hub uses the instance name `default`.

  steps:
    # -------------------------------------------------------------------------
    # 1. Render source-code skeleton into ./code workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-code-skeleton
      name: Render Source Code Skeleton
      action: fetch:template
      input:
        url: ./skeleton/code
        targetPath: ./code
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}
          argoInstance: ${{ parameters.argoInstance }}

    # -------------------------------------------------------------------------
    # 2. Render k8s/gitops skeleton into ./k8 workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-k8-skeleton
      name: Render K8s/GitOps Skeleton
      action: fetch:template
      input:
        url: ./skeleton-k8
        targetPath: ./k8
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}

    # -------------------------------------------------------------------------
    # 3. Publish source-code repo: <org>/<appName>-code
    # -------------------------------------------------------------------------
    - id: publish-code
      name: Create Source Code Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-code&owner=${{ parameters.githubOrg }}
        description: Source code for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./code
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 4. Publish k8s manifests repo: <org>/<appName>-k8
    # -------------------------------------------------------------------------
    - id: publish-k8
      name: Create K8s Manifests Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-k8&owner=${{ parameters.githubOrg }}
        description: Kubernetes/GitOps manifests for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./k8
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 5. Create Argo CD Application in namespace openshift-gitops. Syncs k8/gitops
    #    (including Namespace). Application ignoreDifferences skips Namespace drift
    #    after the initial sync (see k8/app/argocd-app.yaml). Requires argocd:create-resources.
    # -------------------------------------------------------------------------
    - id: create-argocd-app
      name: Create Argo CD Application
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}
        argoInstance: ${{ parameters.argoInstance }}
        namespace: ${{ parameters.namespace }}
        repoUrl: ${{ steps['publish-k8'].output.remoteUrl }}
        path: k8/gitops
        labelValue: ${{ parameters.appName }}

    # -------------------------------------------------------------------------
    # 6. Register the catalog component from the code repo's catalog-info.yaml
    # -------------------------------------------------------------------------
    - id: register-catalog
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-code'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps['publish-code'].output.remoteUrl }}
        icon: github
      - title: K8s Manifests Repository
        url: ${{ steps['publish-k8'].output.remoteUrl }}
        icon: github
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: What happens next
        content: |
          **Argo CD** (RHDH instance `${{ parameters.argoInstance }}`) registered Application
          `${{ parameters.appName }}` in namespace `openshift-gitops`, syncing `k8/gitops`
          into `${{ parameters.namespace }}` (Namespace created on first sync from git).

          Apply ignore rules on the live Application CR (if not already present):
          `oc apply -f https://raw.githubusercontent.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-k8/main/k8/app/argocd-app.yaml -n openshift-gitops`

          Tekton **Pipeline**, triggers, and deployment are managed by Argo CD.
          **PipelineRun** / **TaskRun** objects are excluded from Argo CD reconciliation
          (cluster default); CI runs still appear in the Tekton plugin and `oc`.

          Before CI can push image digests to the k8 repo, create secrets once (cluster admin):
          ```
          oc create secret generic github-token \
            --from-literal=token="$GITHUB_PAT" -n ${{ parameters.namespace }}
          WEBHOOK_SECRET=$(openssl rand -hex 20)
          oc create secret generic github-webhook-secret \
            --from-literal=secret="$WEBHOOK_SECRET" -n ${{ parameters.namespace }}
          ```
          Then add a GitHub **push** webhook on `${{ parameters.appName }}-code` pointing to:
          `oc get route el-${{ parameters.appName }}-listener -n ${{ parameters.namespace }} -o jsonpath='https://{.spec.host}'`
          using `$WEBHOOK_SECRET` as the webhook secret.

          Start the **first build** after Argo CD syncs the Pipeline:
          `oc create -f https://raw.githubusercontent.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-k8/main/k8/app/pipelinerun.yaml -n ${{ parameters.namespace }}`
          (or clone the k8 repo and run `oc create -f k8/app/pipelinerun.yaml -n ${{ parameters.namespace }}`)

          Monitor Argo CD:
          `oc get application ${{ parameters.appName }} -n openshift-gitops`
          UI: OpenShift console → OpenShift GitOps, or your Argo CD route
          (`openshift-gitops-server-openshift-gitops` in namespace `openshift-gitops`).

          Open the catalog component for Kubernetes, Argo CD, and Tekton tabs.
