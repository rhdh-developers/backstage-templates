apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-fastapi
  title: Python FastAPI Application
  description: >
    Creates a Python FastAPI REST API service with two GitHub repos (source code
    and deployment manifests), a Tekton CI pipeline, and an ArgoCD-managed
    OpenShift deployment. Registers a Backstage catalog component with links to
    source and manifests.
  tags:
    - python
    - fastapi
    - openshift
    - gitops
    - tekton
    - argocd
spec:
  owner: user:default/bugbiteme
  type: service

  parameters:
    - title: Application Details
      required:
        - appName
        - githubOrg
        - owner
      properties:
        appName:
          title: Application Name
          type: string
          default: my-rest-api
          description: >
            Lowercase name for your application. Used as the base name for both
            GitHub repos (<name>-code and <name>-k8), the OpenShift namespace,
            and all Kubernetes resources.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        githubOrg:
          title: GitHub Organization
          type: string
          default: rhdh-developers
          description: GitHub organization where both repos will be created.
        owner:
          title: Owner
          type: string
          description: Backstage owner of this component (user or group).
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

  steps:
    # -------------------------------------------------------------------------
    # 1. Render source-code skeleton into ./code workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-code-skeleton
      name: Render Source Code Skeleton
      action: fetch:template
      input:
        url: ./skeleton/code
        targetPath: ./code
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}

    # -------------------------------------------------------------------------
    # 2. Render k8s/gitops skeleton into ./k8 workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-k8-skeleton
      name: Render K8s/GitOps Skeleton
      action: fetch:template
      input:
        url: ./skeleton-k8
        targetPath: ./k8
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}

    # -------------------------------------------------------------------------
    # 3. Publish source-code repo: <org>/<appName>-code
    # -------------------------------------------------------------------------
    - id: publish-code
      name: Create Source Code Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-code&owner=${{ parameters.githubOrg }}
        description: Source code for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./code
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 4. Publish k8s manifests repo: <org>/<appName>-k8
    # -------------------------------------------------------------------------
    - id: publish-k8
      name: Create K8s Manifests Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-k8&owner=${{ parameters.githubOrg }}
        description: Kubernetes/GitOps manifests for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./k8
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public

    # -------------------------------------------------------------------------
    # 5. Create and label the namespace so the OpenShift GitOps operator grants
    #    ArgoCD admin rights in it before the first sync.
    # -------------------------------------------------------------------------
    - id: create-namespace
      name: Create Application Namespace
      action: kubernetes:apply
      input:
        namespaced: false
        manifest: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.appName }}
            labels:
              argocd.argoproj.io/managed-by: openshift-gitops

    # -------------------------------------------------------------------------
    # 6. Store the RHDH GitHub integration token so the Tekton pipeline can
    #    push updated image digests back to the k8 repo.
    # -------------------------------------------------------------------------
    - id: create-github-secret
      name: Create GitHub Token Secret
      action: kubernetes:apply
      input:
        manifest: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: github-token
            namespace: ${{ parameters.appName }}
          type: Opaque
          stringData:
            token: ${{ secrets.USER_OAUTH_TOKEN }}

    # -------------------------------------------------------------------------
    # 7. Create ArgoCD Application. Namespace already exists with the correct
    #    managed-by label, so ArgoCD can sync all resources immediately.
    # -------------------------------------------------------------------------
    - id: create-argocd-app
      name: Create ArgoCD Application
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}
        argoInstance: default
        namespace: openshift-gitops
        repoUrl: https://github.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-k8.git
        path: k8/gitops
        labelValue: ${{ parameters.appName }}

    # -------------------------------------------------------------------------
    # 8. Start the initial PipelineRun to build and deploy the first image.
    # -------------------------------------------------------------------------
    - id: start-pipeline-run
      name: Start Initial Pipeline Run
      action: kubernetes:apply
      input:
        manifest: |
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            generateName: ${{ parameters.appName }}-initial-
            namespace: ${{ parameters.appName }}
            labels:
              app.kubernetes.io/instance: ${{ parameters.appName }}
              backstage.io/kubernetes-id: ${{ parameters.appName }}
              tekton.dev/pipeline: ${{ parameters.appName }}
          spec:
            pipelineRef:
              name: ${{ parameters.appName }}
            params:
            - name: APP_NAME
              value: ${{ parameters.appName }}
            - name: GIT_REPO
              value: https://github.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-code.git
            - name: GIT_K8_REPO
              value: https://github.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-k8.git
            - name: GIT_REVISION
              value: main
            - name: IMAGE_NAME
              value: image-registry.openshift-image-registry.svc:5000/${{ parameters.appName }}/${{ parameters.appName }}
            - name: PATH_CONTEXT
              value: .
            taskRunTemplate:
              serviceAccountName: pipeline
            timeouts:
              pipeline: 1h0m0s
            workspaces:
            - name: workspace
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            - name: k8-workspace
              volumeClaimTemplate:
                spec:
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi

    # -------------------------------------------------------------------------
    # 9. Register the catalog component from the code repo's catalog-info.yaml
    # -------------------------------------------------------------------------
    - id: register-catalog
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-code'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps['publish-code'].output.remoteUrl }}
        icon: github
      - title: K8s Manifests Repository
        url: ${{ steps['publish-k8'].output.remoteUrl }}
        icon: github
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
      - title: Configure GitHub Webhook
        url: https://github.com/${{ parameters.githubOrg }}/${{ parameters.appName }}-code/settings/hooks/new
        icon: github
    text:
      - title: Next steps
        content: |
          **Set up the GitHub webhook** to trigger pipeline builds on every push to the
          code repo.  Get the EventListener URL once ArgoCD has synced:
          ```
          oc get route el-${{ parameters.appName }}-listener -n ${{ parameters.appName }} \
            -o jsonpath='https://{.spec.host}'
          ```
          Then create the webhook HMAC secret:
          ```
          oc create secret generic github-webhook-secret \
            --from-literal=secret=<random-string> \
            -n ${{ parameters.appName }}
          ```
          Use that same random string when adding the webhook in GitHub
          (Settings → Webhooks → Add webhook on the code repo).
