apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-fastapi
  title: Python FastAPI Application
  description: >
    Creates a Python FastAPI REST API service with two GitHub repos (source code
    and deployment manifests) into a pre-existing OpenShift namespace, Tekton CI with
    GitHub push webhook, ArgoCD GitOps deployment, Dev Spaces devfile, and a Backstage catalog
    component with Kubernetes, ArgoCD, and Tekton plugin annotations.
  tags:
    - python
    - fastapi
    - openshift
    - gitops
    - tekton
    - argocd
spec:
  owner: group:default/rhdh-devs
  type: service

  parameters:
    - title: Application Details
      required:
        - appName
        - githubOrg
        - owner
        - namespace
        - argoInstance
        - gateway
      properties:
        appName:
          title: Application Name
          type: string
          default: my-rest-api
          description: >
            Unique name for this app: GitHub repos (<name>-code, <name>-k8), Argo CD
            Application, and Kubernetes object names (e.g. my-rest-api-125). Independent
            of the OpenShift namespace below—many apps can share one namespace.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        githubOrg:
          title: GitHub Organization
          type: string
          default: rhdh-developers
          description: GitHub organization where both repos will be created.
        owner:
          title: Owner
          type: string
          default: group:default/rhdh-developers
          description: Backstage owner of this component (user or group).
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User
        namespace:
          title: OpenShift Namespace
          type: string
          default: my-rest-api
          description: >
            Existing OpenShift project where this app's workloads are deployed (Argo CD
            sync destination, Tekton, Deployment, Routes, image stream path). Must exist
            before the template runs. Change only if you target a different project.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:help: >
            Example: Application Name my-rest-api-125 with Namespace my-rest-api deploys
            into project my-rest-api. Pre-create: oc create namespace <name>
        argoInstance:
          title: RHDH Argo CD instance name
          type: string
          default: default
          description: >
            Must match argocd.appLocatorMethods.instances[].name on Developer Hub
            (argocd:create-resources). Not the OpenShift GitOps CR name.
          ui:help: Case-sensitive. This hub uses the instance name `default`.
        gateway:
          title: Gateway
          type: string
          default: demo.leonlevy.lol
          description: Ingress gateway that will route traffic to this application.
          enum:
            - demo.leonlevy.lol
            - example.leonlevy.lol
          enumNames:
            - 'demo.leonlevy.lol (prod-gateway)'
            - 'example.leonlevy.lol (example-gateway)'

  steps:
    # -------------------------------------------------------------------------
    # 1. Render source-code skeleton into ./code workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-code-skeleton
      name: Render Source Code Skeleton
      action: fetch:template
      input:
        url: ./skeleton/code
        targetPath: ./code
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}
          argoInstance: ${{ parameters.argoInstance }}
          gateway: ${{ parameters.gateway }}

    # -------------------------------------------------------------------------
    # 2. Render k8s/gitops skeleton into ./k8 workspace directory
    # -------------------------------------------------------------------------
    - id: fetch-k8-skeleton
      name: Render K8s/GitOps Skeleton
      action: fetch:template
      input:
        url: ./skeleton-k8
        targetPath: ./k8
        values:
          appName: ${{ parameters.appName }}
          githubOrg: ${{ parameters.githubOrg }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.namespace }}
          gateway: ${{ parameters.gateway }}

    # -------------------------------------------------------------------------
    # 3. Publish source-code repo: <org>/<appName>-code
    # -------------------------------------------------------------------------
    - id: publish-code
      name: Create Source Code Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-code&owner=${{ parameters.githubOrg }}
        description: Source code for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./code
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public
        protectDefaultBranch: false 

    # -------------------------------------------------------------------------
    # 4. Publish k8s manifests repo: <org>/<appName>-k8
    # -------------------------------------------------------------------------
    - id: publish-k8
      name: Create K8s Manifests Repository
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.appName }}-k8&owner=${{ parameters.githubOrg }}
        description: Kubernetes/GitOps manifests for the ${{ parameters.appName }} FastAPI service
        defaultBranch: main
        sourcePath: ./k8
        gitCommitMessage: "chore: initial scaffold from RHDH template"
        repoVisibility: public
        protectDefaultBranch: false 

    # -------------------------------------------------------------------------
    # 5. Create Argo CD Application in namespace openshift-gitops. Syncs k8/gitops
    #    into the pre-existing app namespace. Requires argocd:create-resources.
    # -------------------------------------------------------------------------
    - id: create-argocd-app
      name: Create Argo CD Application
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}
        argoInstance: ${{ parameters.argoInstance }}
        namespace: ${{ parameters.namespace }}
        repoUrl: ${{ steps['publish-k8'].output.remoteUrl }}
        path: k8/gitops
        labelValue: ${{ parameters.appName }}

    # -------------------------------------------------------------------------
    # 6. Register the catalog component from the code repo's catalog-info.yaml
    # -------------------------------------------------------------------------
    - id: register-catalog
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-code'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps['publish-code'].output.remoteUrl }}
        icon: github
      - title: K8s Manifests Repository
        url: ${{ steps['publish-k8'].output.remoteUrl }}
        icon: github
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
    text:
      - title: What happens next
        content: |
          **Application name:** `${{ parameters.appName }}` (repos, Argo CD Application, K8s names)  
            
          **OpenShift namespace:** `${{ parameters.namespace }}` (deployment target—all components)  
            
          **URL:** `https://${{ parameters.appName }}.${{ parameters.gateway }}/api/v1/` after deployment  
            
          **Docs:** `https://${{ parameters.appName }}.${{ parameters.gateway }}/docs` after deployment  
            
  
          Namespace must already exist. Application name and namespace are independent
          (e.g. app `my-rest-api-125` in namespace `my-rest-api`).

          **Argo CD** (RHDH instance `${{ parameters.argoInstance }}`) registered Application
          `${{ parameters.appName }}` in `openshift-gitops`, syncing `k8/gitops` into
          **`${{ parameters.namespace }}`**.

          
          Tekton **Pipeline**, triggers, and deployment are managed by Argo CD (Tekton at
          sync wave 0, app Deployment at wave 1 so ImagePullBackOff does not block CI).
          **PipelineRun** / **TaskRun** are excluded from reconciliation (cluster default).

          Before CI can push image digests to the k8 repo, create secrets once (cluster admin):
          ```
          oc create secret generic github-token \
            --from-literal=token="$GITHUB_PAT" -n ${{ parameters.namespace }}
          WEBHOOK_SECRET=$(openssl rand -hex 20)
          oc create secret generic github-webhook-secret \
            --from-literal=secret="$WEBHOOK_SECRET" -n ${{ parameters.namespace }}
          ```
          Then add a GitHub **push** webhook on `${{ parameters.appName }}-code` pointing to:
          `oc get route el-${{ parameters.appName }}-listener -n ${{ parameters.namespace }} -o jsonpath='https://{.spec.host}'`
          using `$WEBHOOK_SECRET` as the webhook secret.

          Open the catalog component for Kubernetes, Argo CD, and Tekton tabs.
